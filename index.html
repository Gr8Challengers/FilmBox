<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmBox - Movie Logging Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex flex-col justify-between">

  <!-- NAVIGATION -->
  <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <h1 class="text-2xl font-bold tracking-wider text-green-500 cursor-pointer flex items-center gap-2" onclick="showTab('home')">
          <i class="fa-solid fa-film"></i> FilmBox
        </h1>
        <div class="hidden md:flex gap-4">
          <button onclick="showTab('home')" class="hover:text-green-400 text-sm font-semibold uppercase tracking-wider">Home</button>
          <button onclick="showTab('profile')" class="hover:text-green-400 text-sm font-semibold uppercase tracking-wider">Profile & Activity</button>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="relative w-64 md:w-80">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search movie title..." 
          onkeyup="handleSearch(event)"
          class="w-full bg-gray-800 border border-gray-700 rounded-full px-4 py-1.5 text-sm focus:outline-none focus:border-green-500 text-gray-200"
        />
        <i class="fa-solid fa-magnifying-glass absolute right-3 top-2.5 text-gray-400 text-sm"></i>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    
    <!-- SECTION 1: HOME & SEARCH RESULTS -->
    <section id="homeSection">
      <div class="flex justify-between items-center mb-6">
        <h2 id="gridTitle" class="text-xl font-semibold tracking-wide border-l-4 border-green-500 pl-3">Popular Movies</h2>
      </div>
      <!-- Movie Grid -->
      <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
        <p class="text-gray-500 col-span-full text-center py-10">Loading films...</p>
      </div>
    </section>

    <!-- SECTION 2: MOVIE DETAILS (Hidden by default) -->
    <section id="movieDetailSection" class="hidden">
      <button onclick="showTab('home')" class="mb-4 text-sm text-gray-400 hover:text-green-400 flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Back to films
      </button>
      <div id="movieDetailContent"></div>
    </section>

    <!-- SECTION 3: USER PROFILE & ACTIVITY (Hidden by default) -->
    <section id="profileSection" class="hidden">
      <div class="border-b border-gray-800 pb-6 mb-8 flex items-center gap-4">
        <div class="w-16 h-16 rounded-full bg-green-600 flex items-center justify-center text-2xl font-bold">
          U
        </div>
        <div>
          <h2 class="text-2xl font-bold">Cinephile User</h2>
          <p class="text-sm text-gray-400">Film logger & reviewer</p>
        </div>
      </div>

      <!-- Logged Movies Feed -->
      <h3 class="text-xl font-semibold mb-4 border-l-4 border-green-500 pl-3">Logged Reviews</h3>
      <div id="userLogsContainer" class="space-y-4">
        <!-- Logs dynamically injected here -->
      </div>
    </section>

  </main>

  <!-- LOG MOVIE MODAL -->
  <div id="logModal" class="fixed inset-0 bg-black/75 flex items-center justify-center hidden z-50">
    <div class="bg-gray-900 border border-gray-800 rounded-lg max-w-lg w-full p-6 relative">
      <button onclick="closeLogModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <h3 id="modalMovieTitle" class="text-xl font-bold mb-4 text-green-400">Log Film</h3>
      
      <form id="logForm" onsubmit="saveLog(event)" class="space-y-4">
        <input type="hidden" id="modalMovieId">
        <input type="hidden" id="modalMoviePoster">
        <input type="hidden" id="modalMovieName">

        <!-- Rating -->
        <div>
          <label class="block text-sm font-medium mb-1">Rating (1 to 5 Stars)</label>
          <select id="modalRating" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500">
            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
            <option value="4">⭐⭐⭐⭐ (4/5)</option>
            <option value="3">⭐⭐⭐ (3/5)</option>
            <option value="2">⭐⭐ (2/5)</option>
            <option value="1">⭐ (1/5)</option>
          </select>
        </div>

        <!-- Review Text -->
        <div>
          <label class="block text-sm font-medium mb-1">Review</label>
          <textarea id="modalReview" rows="4" placeholder="Write your thoughts..." class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500"></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-2 rounded transition">
          Save Entry
        </button>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-gray-900 border-t border-gray-800 py-6 text-center text-xs text-gray-500">
    Powered by TMDb API. Built for film lovers.
  </footer>

  <!-- APP JAVASCRIPT -->
  <script>
    // -------------------------------------------------------------
    // CONFIGURATION (Add your TMDb API Key below)
    // -------------------------------------------------------------
    const TMDB_API_KEY = '100c687c4d23d5552a3b55ba58eb454a'; 
    const API_BASE = 'https://api.themoviedb.org/3';
    const IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';

    // App State
    let loggedFilms = JSON.parse(localStorage.getItem('loggedFilms')) || [];

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      fetchPopularMovies();
    });

    // -------------------------------------------------------------
    // API CALLS & NAVIGATION
    // -------------------------------------------------------------
    async function fetchPopularMovies() {
      try {
        const res = await fetch(`${API_BASE}/movie/popular?api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        renderMovieGrid(data.results, "Popular Movies");
      } catch (err) {
        document.getElementById('movieGrid').innerHTML = `
          <div class="col-span-full text-center text-red-400">
            Unable to fetch movies. Please verify your TMDb API key in the code.
          </div>`;
      }
    }

    async function handleSearch(e) {
      const query = e.target.value.trim();
      if (query.length < 2) {
        if (query.length === 0) fetchPopularMovies();
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        renderMovieGrid(data.results, `Search Results for "${query}"`);
      } catch (err) {
        console.error(err);
      }
    }

    // Render Movie Grid (Letterboxd-style Poster Layout)
    function renderMovieGrid(movies, title) {
      document.getElementById('gridTitle').innerText = title;
      const grid = document.getElementById('movieGrid');
      
      if (!movies || movies.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-gray-400">No movies found.</p>`;
        return;
      }

      grid.innerHTML = movies.map(movie => {
        const posterUrl = movie.poster_path ? IMAGE_BASE + movie.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster';
        return `
          <div class="group relative rounded-md overflow-hidden bg-gray-900 border border-gray-800 hover:border-green-500 cursor-pointer transition duration-200" onclick="loadMovieDetails(${movie.id})">
            <img src="${posterUrl}" alt="${movie.title}" class="w-full h-72 object-cover group-hover:scale-105 transition duration-300">
            <div class="p-3">
              <h3 class="font-semibold text-sm truncate text-gray-200 group-hover:text-green-400">${movie.title}</h3>
              <p class="text-xs text-gray-400">${movie.release_date ? movie.release_date.split('-')[0] : 'N/A'}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    // Load Single Movie Detail View
    async function loadMovieDetails(movieId) {
      try {
        const res = await fetch(`${API_BASE}/movie/${movieId}?api_key=${TMDB_API_KEY}&append_to_response=credits`);
        const movie = await res.json();

        const backdropUrl = movie.backdrop_path ? `https://image.tmdb.org/t/p/w1280${movie.backdrop_path}` : '';
        const posterUrl = movie.poster_path ? IMAGE_BASE + movie.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster';
        const director = movie.credits?.crew?.find(c => c.job === 'Director')?.name || 'Unknown';
        
        const content = document.getElementById('movieDetailContent');
        content.innerHTML = `
          <div class="relative rounded-xl overflow-hidden bg-gray-900 border border-gray-800">
            ${backdropUrl ? `<div class="h-64 bg-cover bg-center opacity-30" style="background-image: url('${backdropUrl}')"></div>` : ''}
            
            <div class="p-6 md:p-8 flex flex-col md:flex-row gap-8 relative ${backdropUrl ? '-mt-32' : ''}">
              <img src="${posterUrl}" class="w-48 h-72 rounded-lg border-2 border-gray-700 shadow-xl object-cover">
              
              <div class="flex-1 space-y-4">
                <h1 class="text-3xl font-extrabold text-white">${movie.title} <span class="text-gray-400 text-2xl font-normal">(${movie.release_date.split('-')[0]})</span></h1>
                <p class="text-sm text-gray-400">Directed by <span class="text-gray-200 font-medium">${director}</span></p>
                
                <p class="text-gray-300 text-sm leading-relaxed">${movie.overview}</p>

                <div class="flex gap-4 pt-4">
                  <button onclick="openLogModal('${movie.id}', '${movie.title.replace(/'/g, "\\'")}', '${movie.poster_path}')" class="bg-green-600 hover:bg-green-500 text-white font-semibold px-5 py-2 rounded-lg text-sm flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Review or Log
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;

        showTab('detail');
      } catch (err) {
        console.error(err);
      }
    }

    // -------------------------------------------------------------
    // LOG & REVIEW SYSTEM (LocalStorage)
    // -------------------------------------------------------------
    function openLogModal(id, title, posterPath) {
      document.getElementById('modalMovieId').value = id;
      document.getElementById('modalMovieName').value = title;
      document.getElementById('modalMoviePoster').value = posterPath;
      document.getElementById('modalMovieTitle').innerText = `Log "${title}"`;
      document.getElementById('logModal').classList.remove('hidden');
    }

    function closeLogModal() {
      document.getElementById('logModal').classList.add('hidden');
      document.getElementById('logForm').reset();
    }

    function saveLog(e) {
      e.preventDefault();
      const newLog = {
        id: document.getElementById('modalMovieId').value,
        title: document.getElementById('modalMovieName').value,
        poster: document.getElementById('modalMoviePoster').value,
        rating: document.getElementById('modalRating').value,
        review: document.getElementById('modalReview').value,
        date: new Date().toLocaleDateString()
      };

      loggedFilms.unshift(newLog);
      localStorage.setItem('loggedFilms', JSON.stringify(loggedFilms));
      closeLogModal();
      alert('Movie Logged Successfully!');
      showTab('profile');
    }

    function renderUserLogs() {
      const container = document.getElementById('userLogsContainer');
      if (loggedFilms.length === 0) {
        container.innerHTML = `<p class="text-gray-500">You haven't logged any movies yet.</p>`;
        return;
      }

      container.innerHTML = loggedFilms.map(log => `
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 flex gap-4 items-start">
          <img src="${IMAGE_BASE + log.poster}" class="w-16 h-24 object-cover rounded">
          <div class="flex-1">
            <div class="flex justify-between items-center mb-1">
              <h4 class="font-bold text-lg text-gray-100">${log.title}</h4>
              <span class="text-xs text-gray-500">${log.date}</span>
            </div>
            <div class="text-yellow-400 text-sm mb-2">${'⭐'.repeat(log.rating)}</div>
            <p class="text-gray-300 text-sm leading-normal">${log.review || '<em>No review text provided.</em>'}</p>
          </div>
        </div>
      `).join('');
    }

    // -------------------------------------------------------------
    // NAVIGATION SWITCHER
    // -------------------------------------------------------------
    function showTab(tabName) {
      document.getElementById('homeSection').classList.add('hidden');
      document.getElementById('movieDetailSection').classList.add('hidden');
      document.getElementById('profileSection').classList.add('hidden');

      if (tabName === 'home') {
        document.getElementById('homeSection').classList.remove('hidden');
      } else if (tabName === 'detail') {
        document.getElementById('movieDetailSection').classList.remove('hidden');
      } else if (tabName === 'profile') {
        renderUserLogs();
        document.getElementById('profileSection').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
